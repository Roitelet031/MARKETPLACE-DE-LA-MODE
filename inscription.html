<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer un administrateur</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:30px;
width:400px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
width:100%;
padding:12px;
background:#0066cc;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#004d99;
}
</style>
</head>

<body>

<div class="container">

<h2>👑 Créer un administrateur</h2>

<input type="text" id="nom" placeholder="Nom complet">

<input type="email" id="email" placeholder="Adresse e-mail">

<input type="tel" id="telephone" placeholder="Téléphone">

<input type="password" id="password" placeholder="Mot de passe">

<select id="niveau">
<option value="">Choisir un niveau</option>
<option value="admin">🛡️ Administrateur</option>
<option value="moderateur">👨‍💼 Modérateur</option>
</select>

<button onclick="creerAdmin()">
Créer le compte
</button>

</div>

<script>

function creerAdmin(){

let nom=document.getElementById("nom").value;
let email=document.getElementById("email").value;
let password=document.getElementById("password").value;
let niveau=document.getElementById("niveau").value;

if(nom===""||email===""||password===""||niveau===""){
alert("Veuillez remplir tous les champs.");
return;
}

alert("Le compte administrateur a été créé avec succès.");

}

</script>

</body>
</html>
