


<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande</title>
<style>
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#f5f7fa,#c3cfe2);
    padding:20px;
}
.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}
h1{
    text-align:center;
    margin-bottom:20px;
}
input, textarea, select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}
button{
    width:100%;
    padding:12px;
    border:none;
    background:#111;
    color:white;
    border-radius:8px;
    cursor:pointer;
}
.total{
    font-size:22px;
    font-weight:bold;
    color:#27ae60;
    text-align:center;
    margin:15px 0;
}
</style>
</head>
<body>
<div class="container">
<h1>📦 Finaliser la commande</h1>
<input type="text" id="nom" placeholder="Nom complet">
<input type="tel" id="telephone"
placeholder="+243 XXX XXX XXX">
<input type="text" id="ville"
placeholder="Ville">
<textarea id="adresse"
placeholder="Adresse de livraison"></textarea>
<select id="paiement">
<option value="">Choisir un moyen de paiement</option>
<option>Orange Money</option>
<option>M-Pesa</option>
<option>Airtel Money</option>
<option>Carte Bancaire</option>
</select>
<p class="total" id="total"></p>
<button onclick="passerCommande()">
Confirmer la commande
</button>
</div>
<script>
<script>
// 1. Récupération du panier
let panier = JSON.parse(localStorage.getItem("panier")) || [];

let total = 0;
panier.forEach(item => {
    total += item.prix;
});

// Affichage du total dans la page
document.getElementById("total").innerText = "Total à payer : " + total + " $";

// 2. Fonction pour passer la commande
function passerCommande() {
    // Récupération des valeurs du formulaire
    let nom = document.getElementById("nom").value.trim();
    let telephone = document.getElementById("telephone").value.trim();
    let ville = document.getElementById("ville").value.trim();
    let adresse = document.getElementById("adresse").value.trim();
    let paiement = document.getElementById("paiement").value;

if (!nom || !telephone || !ville || !adresse || !paiement) {
    alert("Veuillez remplir tous les champs");
    return;
}
    }

    // Création de l'objet commande
    let commande = {
        id: Date.now(),
        nom: nom,
        telephone: telephone,
        ville: ville,
        adresse: adresse,
        paiement: paiement,
        produits: panier,
        total: total
    };

    // Sauvegarde de la commande dans le localStorage
    localStorage.setItem("commande_" + commande.id, JSON.stringify(commande));

    // Nettoyage du panier après l'achat
    localStorage.removeItem("panier");

    alert("🎉 Commande enregistrée avec succès !");
    console.log(commande);

    // Redirection vers le catalogue après la validation
    window.location.href = "Catalogue.html";
}
</script>
</body>
</html>
